name: Step 5 refactor employees

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step5-refactor-employees.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refactor employee core
        run: python3 tools/refactor_employee_step5.py
      - name: Syntax checks
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          matches=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.S)
          main=next((x for x in matches if 'const SUPABASE_URL' in x),None)
          if main is None: raise SystemExit('Main inline script not found')
          Path('/tmp/ma-main.js').write_text(main,encoding='utf-8')
          PY
          node --check /tmp/ma-main.js
          grep -q 'src="employees.js"' index.html
          grep -q 'window.MAEmployees.create' index.html
          ! grep -q '^  function employeeUpcomingShifts' index.html
          grep -q 'function employeeUpcomingShifts' employees.js
          git diff --check
      - name: Employee runtime smoke test
        run: |
          node <<'NODE'
          global.window=global;
          const store=new Map([['ma_employee_name_v1','Арсен']]);
          global.localStorage={getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)};
          require('./employees.js');
          const settings={service1:'Моба',service2:'Нова',employeeSchedules:[{name:'Арсен',role:'manager'},{name:'Дина',role:'manager'},{name:'Георгий',role:'master'},{name:'Асик',role:'master'}],staffChanges:[],shiftStart:'08:00',shiftEnd:'22:00',novaShiftStart:'09:00',novaShiftEnd:'19:00'};
          const rows=[{date:new Date(2026,8,7),s1:{manager:'Арсен',master:'Олег'},s2:{manager:'Асик',master:'Асик'}},{date:new Date(2026,8,8),s1:{manager:'Арсен',master:'Олег'},s2:{manager:'Георгий',master:'Георгий'}}];
          const api=global.MAEmployees.create({
            getSettings:()=>settings,
            moscowParts:()=>({date:'2026-09-07',hour:10,minute:0}),
            dateObjectFromKey:s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)},
            employeesForDate:()=>[{name:'Арсен',role:'manager'},{name:'Дина',role:'manager'},{name:'Георгий',role:'master'},{name:'Асик',role:'master'}],
            MANAGER_ROSTER_FROM:'2026-09-07',EMPLOYEE_STORAGE_KEY:'ma_employee_name_v1',EMPLOYEE_PUSH_NAME_KEY:'ma_employee_push_name_v1',
            expectedForDate:(date,service)=>service==='Моба'?{manager:'Арсен',master:'Олег'}:{manager:'Асик',master:'Асик'},
            getCurrentMonthIndex:()=>0,
            monthInfo:()=>({year:2026,month:8,days:2}),
            buildMonthRows:()=>rows,
            isNoManagerValue:v=>v==='Без менеджера',isNoMasterValue:v=>v==='Без мастера',
            getCurrentShiftRows:()=>[],shiftStartForService:s=>s==='Нова'?'09:00':'08:00',shiftMinutes:t=>{const [h,m]=t.split(':').map(Number);return h*60+m},
            formatMoscowTime:()=>'',escapeHtml:s=>String(s)
          });
          if(api.selectedEmployee()!=='Арсен') throw new Error('selectedEmployee failed');
          const names=api.activeEmployeeNames('2026-09-07');
          if(!names.includes('Арсен')||!names.includes('Асик')) throw new Error('activeEmployeeNames failed');
          const managers=api.activeManagerNames('2026-09-07');
          if(!managers.includes('Арсен')||!managers.includes('Георгий')||!managers.includes('Асик')) throw new Error('activeManagerNames failed');
          const a=api.employeeAssignmentForDate('Асик','2026-09-07');
          if(!a||a.service!=='Нова'||a.pair.manager!=='Асик'||a.pair.master!=='Асик') throw new Error('Nova assignment failed');
          const u=api.employeeUpcomingShifts('Арсен',{afterToday:false,limit:2});
          if(u.length<1||u[0].service!=='Моба') throw new Error('upcoming shifts failed');
          console.log('Employee smoke test OK');
          NODE
      - name: Publish step 5
        run: |
          rm -f .github/workflows/step5-refactor-employees.yml
          rm -f .github/workflows/inspect-employee-step5.yml
          rm -f tools/refactor_employee_step5.py
          rm -f tools/inspect_employee_step5.py
          git config user.name "MA Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add index.html employees.js .github/workflows/step5-refactor-employees.yml .github/workflows/inspect-employee-step5.yml tools/refactor_employee_step5.py tools/inspect_employee_step5.py
          git diff --cached --check
          git commit -m "Step 5: move employee logic to employees.js"
          git push origin HEAD:main
