name: Stage 4 modularization
on:
  push:
    paths:
      - 'tools/apply_stage4_modules.py'
      - '.github/workflows/stage4-modularize.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Split app.js safely
        run: python3 tools/apply_stage4_modules.py
      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check errors.js
          node --check settings.js
          node --check devices.js
          node --check history.js
          node --check app.js
          node --check tests/run-tests.js
      - name: Run regression suite
        run: node tests/run-tests.js
      - name: Verify module boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          for f in ['settings.js','devices.js','history.js']:
            if f'<script src="{f}"></script>' not in html: raise SystemExit('missing '+f)
          forbidden=['function normalizeScheduleSettings(','function generateDeviceKeyRecord(','function renderHistory(rows)']
          for needle in forbidden:
            if needle in app: raise SystemExit('still in app.js: '+needle)
          print('Stage 4 boundaries OK')
          PY
      - name: Publish stage 4
        run: |
          git config user.name "MA Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html settings.js devices.js history.js tests/run-tests.js
          git diff --cached --check
          git commit -m "Split device history and settings modules"
          git push
