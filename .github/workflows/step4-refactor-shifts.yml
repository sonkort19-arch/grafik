name: Step 4 refactor shifts

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/step4-refactor-shifts.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refactor shift core
        run: python3 tools/refactor_shifts_step4.py

      - name: Syntax checks
        run: |
          node --check shifts.js
          node --check schedule.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          matches=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.S)
          main=next((x for x in matches if 'const SUPABASE_URL' in x),None)
          if main is None:
              raise SystemExit('Main inline script not found')
          Path('/tmp/ma-main.js').write_text(main,encoding='utf-8')
          PY
          node --check /tmp/ma-main.js
          grep -q 'src="shifts.js"' index.html
          ! grep -q 'function shiftStartForService' index.html
          grep -q 'global.MAShifts' shifts.js
          git diff --check

      - name: Shift runtime smoke test
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const sandbox={window:{}};
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('shifts.js','utf8'),sandbox);
          const settings={
            service1:'Мобильный Ангел',
            service2:'Нова',
            shiftStart:'08:00',
            shiftEnd:'22:00',
            novaShiftStart:'09:00',
            novaShiftEnd:'19:00'
          };
          const api=sandbox.window.MAShifts.create({
            getSettings:()=>settings,
            monthIndexForYearMonth:(y,m)=>y*12+m,
            getDaySchedule:()=>((idx,d)=>({s1:{manager:'Арсен',master:'Олег'},s2:{manager:'Асик',master:'Асик'}}))
          });
          function ok(cond,msg){ if(!cond) throw new Error(msg); }
          ok(api.shiftStartForService('Мобильный Ангел')==='08:00','Moba start');
          ok(api.shiftEndForService('Мобильный Ангел')==='22:00','Moba end');
          ok(api.shiftStartForService('Нова')==='09:00','Nova start');
          ok(api.shiftEndForService('Нова')==='19:00','Nova end');
          ok(api.shiftMinutes('09:10')===550,'minutes conversion');
          ok(api.isValidShiftPin('1234')===true,'valid pin');
          ok(api.isValidShiftPin('123')===false,'short pin');
          ok(api.isValidShiftPin('12a4')===false,'non numeric pin');
          const nova=api.expectedForDate('2026-09-07','Нова');
          ok(nova.manager==='Асик' && nova.master==='Асик','Nova responsible');
          const moba=api.expectedForDate('2026-09-07','Мобильный Ангел');
          ok(moba.manager==='Арсен' && moba.master==='Олег','Moba pair');
          console.log('Shift runtime smoke test: OK');
          NODE

      - name: Publish step 4
        run: |
          rm -f .github/workflows/step4-refactor-shifts.yml
          rm -f tools/refactor_shifts_step4.py
          git config user.name "MA Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add index.html shifts.js .github/workflows/step4-refactor-shifts.yml tools/refactor_shifts_step4.py
          git diff --cached --check
          git commit -m "Step 4: move shift rules to shifts.js"
          git push origin HEAD:main
