name: One-time MA roster update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ma-roster-2026-09-07.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: |
          sed -i 's/if count < 3:/if count < 2:/' tools/patch_roster_2026_09_07.py
          sed -i 's/expected >=3/expected >=2/' tools/patch_roster_2026_09_07.py
          python3 tools/patch_roster_2026_09_07.py
      - name: Validate and publish
        run: |
          rm -f .github/workflows/ma-roster-2026-09-07.yml
          rm -f tools/patch_roster_2026_09_07.py
          git config user.name "MA Schedule Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/ma-roster-2026-09-07.yml tools/patch_roster_2026_09_07.py
          git diff --cached --check
          git commit -m "Update manager and Nova shift schedule"
          git push origin HEAD:main
