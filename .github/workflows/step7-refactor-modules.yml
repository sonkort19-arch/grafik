name: Step 7 refactor modules
on:
  push:
    paths:
      - 'tools/refactor_step7_modules.py'
      - '.github/workflows/step7-refactor-modules.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate wallet and admin modules
        run: python3 tools/refactor_step7_modules.py
      - name: Syntax checks
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          if not scripts: raise SystemExit('inline main script not found')
          Path('/tmp/ma-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/ma-main.js
      - name: Wallet core smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');const vm=require('vm');
          global.window={};
          const store=new Map();
          global.localStorage={getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)};
          global.crypto={randomUUID:()=> '123e4567-e89b-12d3-a456-426614174000'};
          vm.runInThisContext(fs.readFileSync('wallets.js','utf8'));
          const api=window.MAWallets.create({
            moscowParts:()=>({year:2026,month:9}),SHIFT_TIMEZONE:'Europe/Moscow',
            MONTHS:['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'],
            WALLET_DATA_VERSION:3,WALLET_STORAGE_KEY:'test_wallets'
          });
          if(api.walletCurrentMonthKey()!=='2026-09') throw new Error('month key failed');
          if(api.parseMoneyInput('1 234,56')!==123456) throw new Error('money parse failed');
          if(api.formatMoney(123456)!=='1 234,56 ₽' && api.formatMoney(123456)!=='1 234,56 ₽') throw new Error('money format failed');
          const state=api.normalizeWalletState({version:3,wallets:[],transactions:[]});
          if(!state.wallets.some(w=>w.id==='insurance')) throw new Error('insurance migration failed');
          const op=api.buildWalletOperation('topup',[{walletId:'products',amountCents:5000}],'test',{operationId:'op1',createdAt:'2026-09-07T12:00:00.000Z'});
          if(op.items.length!==1 || op.items[0].amountCents!==5000) throw new Error('operation build failed');
          console.log('Wallet core smoke test OK');
          NODE
      - name: Admin session smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');const vm=require('vm');
          global.window={};
          const store=new Map();
          global.localStorage={getItem:k=>store.has(k)?store.get(k):null,setItem:(k,v)=>store.set(k,String(v)),removeItem:k=>store.delete(k)};
          let session=null,changes=0;
          vm.runInThisContext(fs.readFileSync('admin.js','utf8'));
          const api=window.MAAdmin.create({storageKey:'test_admin',getSession:()=>session,setSession:s=>session=s,onSessionChange:()=>changes++});
          api.saveAdminSession({access_token:'abc'});
          if(!api.isAdmin() || changes!==1) throw new Error('admin save/check failed');
          session=null;
          session=api.loadAdminSession();
          if(session?.access_token!=='abc') throw new Error('admin load failed');
          api.saveAdminSession(null);
          if(api.isAdmin()) throw new Error('admin logout failed');
          console.log('Admin session smoke test OK');
          NODE
      - name: Verify integration
        run: |
          grep -q '<script src="wallets.js"></script>' index.html
          grep -q '<script src="admin.js"></script>' index.html
          grep -q 'window.MAWallets.create' index.html
          grep -q 'window.MAAdmin.create' index.html
          ! grep -q 'function normalizeWalletState' index.html
          ! grep -q 'function loadAdminSession' index.html
      - name: Publish step 7
        run: |
          git config user.name "MA Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "No changes to publish"; exit 0; fi
          git commit -m "Step 7: separate wallet and admin core"
          git push
