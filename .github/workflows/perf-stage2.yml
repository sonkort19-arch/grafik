name: Stage 2 performance optimization
on:
  push:
    paths:
      - 'tools/apply_perf_stage2.py'
      - '.github/workflows/perf-stage2.yml'
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply performance patch
        run: python3 tools/apply_perf_stage2.py
      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check app.js
      - name: Run regression suite
        run: node tests/run-tests.js
      - name: Verify optimization markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('app.js').read_text(encoding='utf-8')
          checks=[
            'const monthRowsCache=new Map();',
            'if(monthRowsCache.has(monthIndex)) return monthRowsCache.get(monthIndex);',
            'if(attentionSignature===lastAttentionSignature) return;',
            'if(Date.now()-lastServiceWorkerUpdateAt>60000)',
            'if(isAdmin() && !$("walletsPage").classList.contains("hidden")) syncWalletsCloud(false);',
            'if(isAdmin() && !$("walletsPage").classList.contains("hidden")) tasks.push(syncWalletsCloud(false));'
          ]
          for c in checks:
            if c not in t: raise SystemExit('missing optimization: '+c)
          if 'renderTodayShifts();\n      renderAdminAttention();\n      loadTodayShifts(false);' in t:
            raise SystemExit('duplicate attention render remains in switchTab')
          print('Performance markers OK')
          PY
      - name: Publish optimized app
        run: |
          git config user.name "MA Performance"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Optimize MA Grafik runtime performance"
          git push
