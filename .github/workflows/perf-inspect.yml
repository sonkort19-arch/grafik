name: Performance inspection
on:
  push:
    paths:
      - 'tools/perf_inspect.py'
      - '.github/workflows/perf-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect performance hotspots
        run: python3 tools/perf_inspect.py
