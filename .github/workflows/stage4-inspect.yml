name: Stage 4 structure inspection
on:
  push:
    paths:
      - 'tools/inspect_stage4.py'
      - '.github/workflows/stage4-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect app.js structure
        run: python3 tools/inspect_stage4.py
