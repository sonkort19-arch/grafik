name: Stage 5 data safety inspection
on:
  push:
    paths:
      - 'tools/inspect_stage5.py'
      - '.github/workflows/stage5-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect data safety paths
        run: python3 tools/inspect_stage5.py
