name: Stage 3 error inspection
on:
  push:
    paths:
      - 'tools/inspect_stage3.py'
      - '.github/workflows/stage3-inspect.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect error handling and settings UI
        run: python3 tools/inspect_stage3.py
