name: Step 6 refactor Supabase
on:
  push:
    paths:
      - 'tools/refactor_step6_supabase.py'
      - '.github/workflows/step6-refactor-supabase.yml'
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor Supabase core
        run: python3 tools/refactor_step6_supabase.py
      - name: Syntax checks
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S)
          if not scripts:
              raise SystemExit('inline main script not found')
          Path('/tmp/ma-main.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/ma-main.js
      - name: Supabase runtime smoke test
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          global.window={};
          global.navigator={onLine:true};
          global.document={hidden:false};
          let savedSession=null;
          let calls=[];
          global.fetch=async (url,options={})=>{
            calls.push({url,options});
            if(String(url).includes('/auth/v1/token?grant_type=password')){
              return {ok:true,status:200,statusText:'OK',json:async()=>({access_token:'token-1',refresh_token:'refresh-1',expires_in:3600})};
            }
            return {ok:true,status:200,statusText:'OK',text:async()=>'',json:async()=>({})};
          };
          vm.runInThisContext(fs.readFileSync('supabase.js','utf8'));
          const api=window.MASupabase.create({
            url:'https://example.supabase.co',
            publishableKey:'sb_publishable_test',
            getAdminSession:()=>savedSession,
            saveAdminSession:s=>{savedSession=s;}
          });
          if(!api.cloudConfigured()) throw new Error('cloudConfigured failed');
          if(api.classifySyncError({status:401,message:'bad'}).kind!=='auth') throw new Error('401 classification failed');
          (async()=>{
            await api.authFetch('/rest/v1/test');
            const first=calls[0];
            if(first.url!=='https://example.supabase.co/rest/v1/test') throw new Error('REST URL failed');
            if(first.options.headers.apikey!=='sb_publishable_test') throw new Error('apikey header failed');
            await api.loginAdmin('admin@example.com','pass');
            if(savedSession?.access_token!=='token-1') throw new Error('login session failed');
            const token=await api.getAdminToken();
            if(token!=='token-1') throw new Error('getAdminToken failed');
            console.log('Supabase smoke test OK');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
      - name: Verify module integration
        run: |
          grep -q '<script src="supabase.js"></script>' index.html
          grep -q 'window.MASupabase.create' index.html
          ! grep -q 'function cloudConfigured' index.html
          ! grep -q 'async function authFetch' index.html
      - name: Publish step 6
        run: |
          git config user.name "MA Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Step 6: move Supabase cloud core to supabase.js"
          git push
