name: Fix MA startup key

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-startup-key.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 tools/fix_startup_key.py
      - name: Validate and publish
        run: |
          rm -f .github/workflows/fix-startup-key.yml
          rm -f tools/fix_startup_key.py
          git config user.name "MA Schedule Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/fix-startup-key.yml tools/fix_startup_key.py
          git diff --cached --check
          git commit -m "Fix MA Grafik startup error"
          git push origin HEAD:main
