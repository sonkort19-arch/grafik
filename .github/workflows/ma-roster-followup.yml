name: MA roster follow-up

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ma-roster-followup.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply follow-up
        run: python3 tools/patch_roster_followup.py
      - name: Validate and publish
        run: |
          rm -f .github/workflows/ma-roster-followup.yml
          rm -f tools/patch_roster_followup.py
          git config user.name "MA Schedule Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/ma-roster-followup.yml tools/patch_roster_followup.py
          git diff --cached --check
          git commit -m "Tighten Nova responsible shift flow"
          git push origin HEAD:main
