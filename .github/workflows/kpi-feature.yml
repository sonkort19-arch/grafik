name: KPI feature integration

on:
  push:
    branches: [feature-kpi-2026-09-07]

permissions:
  contents: write

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Harden KPI historical attribution
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old,new,1)

          kpi=Path("kpi.js").read_text(encoding="utf-8")
          if "function responsibleForRow" not in kpi:
              old='''    function responsibleFor(dateStr,service){\n      const expected=typeof expectedForDate==="function"?expectedForDate(dateStr,service):null;\n      const manager=String(expected?.manager||"").trim();\n      if(!manager || isNoManagerValue(manager)) return null;\n      const info=employeeInfo(manager,dateStr);\n      return {name:manager,role:info?.role||((expected?.manager===expected?.master)?"master":"manager"),expected};\n    }'''
              new='''    function responsibleFor(dateStr,service){\n      const expected=typeof expectedForDate==="function"?expectedForDate(dateStr,service):null;\n      const manager=String(expected?.manager||"").trim();\n      if(!manager || isNoManagerValue(manager)) return null;\n      const info=employeeInfo(manager,dateStr);\n      return {name:manager,role:info?.role||((expected?.manager===expected?.master)?"master":"manager"),expected};\n    }\n\n    function responsibleForRow(row,fallback){\n      const dateStr=String(row?.shift_date||"");\n      const stored=String(row?.expected_manager||"").trim();\n      if(!stored || isNoManagerValue(stored)) return fallback||null;\n      const info=employeeInfo(stored,dateStr);\n      const storedMaster=String(row?.expected_master||"").trim();\n      return {name:stored,role:info?.role||((storedMaster&&stored===storedMaster)?"master":"manager"),expected:{manager:stored,master:storedMaster||null}};\n    }'''
              kpi=replace_once(kpi,old,new,"row responsibility helper")

              old='''        const resp=responsibleFor(String(row.shift_date),String(row.service));\n        if(!resp || String(row.opened_by)!==resp.name) return;'''
              new='''        const fallback=responsibleFor(String(row.shift_date),String(row.service));\n        const resp=responsibleForRow(row,fallback);\n        if(!resp || String(row.opened_by)!==resp.name) return;'''
              kpi=replace_once(kpi,old,new,"activation historical responsibility")

              old='''          const resp=responsibleFor(date,service);\n          if(!resp) continue;\n          const key=`${date}|${service}`;\n          const row=activeRows.get(key)||null;\n          if(!row && voidedPairs.has(key)) continue;'''
              new='''          const key=`${date}|${service}`;\n          const row=activeRows.get(key)||null;\n          if(!row && voidedPairs.has(key)) continue;\n          const fallbackResp=responsibleFor(date,service);\n          const resp=row?responsibleForRow(row,fallbackResp):fallbackResp;\n          if(!resp) continue;'''
              kpi=replace_once(kpi,old,new,"historical row responsibility")

              old='''          if(row.closed_at){\n            const early=Math.max(0,Number(row.early_close_minutes)||0);\n            if(early>0){\n              stat.early++;\n              stat.earlyMinutes+=early;\n              stat.issues.push({date,service,type:"early",text:`Закрытие раньше на ${early} мин`});\n            }\n          }else if(shouldCountClosing(date,service,current)){'''
              new='''          if(row.closed_at){\n            const early=Math.max(0,Number(row.early_close_minutes)||0);\n            if(early>0 && String(row.closed_by||"")===resp.name){\n              stat.early++;\n              stat.earlyMinutes+=early;\n              stat.issues.push({date,service,type:"early",text:`Закрытие раньше на ${early} мин`});\n            }\n          }else if(shouldCountClosing(date,service,current)){'''
              kpi=replace_once(kpi,old,new,"early close attribution")
              Path("kpi.js").write_text(kpi,encoding="utf-8")

          tests=Path("tests/run-tests.js").read_text(encoding="utf-8")
          if "сохранённого ответственного смены" not in tests:
              marker='''test("KPI: аннулированная смена исключается и не портит сотруднику оценку",()=>{'''
              extra='''test("KPI: использует сохранённого ответственного смены для исторической справедливости",()=>{\n  const rows=[{\n    service:"Моба",shift_date:"2026-09-07",expected_manager:"Дина",expected_master:"Олег",\n    opened_at:"2026-09-07T05:00:00.000Z",opened_by:"Дина",open_late_minutes:0,\n    closed_at:"2026-09-07T19:00:00.000Z",closed_by:"Дина",early_close_minutes:0\n  }];\n  const result=kpiApi.calculate(rows,{from:"2026-09-07",to:"2026-09-07",now:{date:"2026-09-07",hour:22,minute:30}});\n  const dina=result.employees.find(x=>x.name==="Дина");\n  const arsen=result.employees.find(x=>x.name==="Арсен");\n  assert(dina);assert(arsen);\n  assert.strictEqual(dina.total,1);\n  assert.strictEqual(dina.worked,1);\n  assert.strictEqual(dina.score,100);\n  assert.strictEqual(arsen.total,0);\n});\n\ntest("KPI: раннее закрытие другим человеком не штрафует ответственного",()=>{\n  const rows=[{\n    service:"Моба",shift_date:"2026-09-07",expected_manager:"Арсен",expected_master:"Олег",\n    opened_at:"2026-09-07T05:00:00.000Z",opened_by:"Арсен",open_late_minutes:0,\n    closed_at:"2026-09-07T18:40:00.000Z",closed_by:"Дина",early_close_minutes:20\n  }];\n  const result=kpiApi.calculate(rows,{from:"2026-09-07",to:"2026-09-07",now:{date:"2026-09-07",hour:22,minute:30}});\n  const arsen=result.employees.find(x=>x.name==="Арсен");\n  assert(arsen);\n  assert.strictEqual(arsen.early,0);\n  assert.strictEqual(arsen.score,100);\n});\n\n'''
              if marker not in tests:
                  raise SystemExit("KPI test insertion marker not found")
              tests=tests.replace(marker,extra+marker,1)
              Path("tests/run-tests.js").write_text(tests,encoding="utf-8")
          PY

      - name: Check JavaScript syntax
        run: |
          node --check kpi.js
          node --check app.js
          node --check tests/run-tests.js

      - name: Run regression tests
        run: node tests/run-tests.js

      - name: Verify hardened KPI rules
        run: |
          grep -q 'function responsibleForRow' kpi.js
          grep -q 'String(row.closed_by||"")===resp.name' kpi.js
          grep -q 'сохранённого ответственного смены' tests/run-tests.js
          git diff --check

      - name: Commit tested product files
        run: |
          if git diff --quiet -- kpi.js tests/run-tests.js; then
            echo "KPI hardening already applied"
            exit 0
          fi
          git config user.name "MA KPI Builder"
          git config user.email "actions@users.noreply.github.com"
          git add kpi.js tests/run-tests.js
          git diff --cached --check
          git commit -m "Harden KPI historical attribution"
          git push
