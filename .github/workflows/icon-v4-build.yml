name: Build final MA icon assets

on:
  push:
    branches: [icon-refresh-v3]
    paths:
      - 'ma-icon-green-v4-192.png'
      - '.github/workflows/icon-v4-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icon-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure ImageMagick
        run: |
          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi
      - name: Generate required icon sizes
        run: |
          convert ma-icon-green-v4-192.png -filter Lanczos -resize 512x512 ma-icon-green-v4-512.png
          convert ma-icon-green-v4-192.png -filter Lanczos -resize 180x180 ma-apple-touch-green-v4.png
          convert ma-icon-green-v4-192.png -filter Lanczos -resize 64x64 ma-favicon-green-v4.png
          identify ma-icon-green-v4-192.png ma-icon-green-v4-512.png ma-apple-touch-green-v4.png ma-favicon-green-v4.png
      - name: Commit generated assets
        run: |
          git config user.name "MA Icon Builder"
          git config user.email "actions@users.noreply.github.com"
          git add ma-icon-green-v4-512.png ma-apple-touch-green-v4.png ma-favicon-green-v4.png
          if git diff --cached --quiet; then
            echo "Icon assets already current"
            exit 0
          fi
          git commit -m "Generate final MA icon sizes"
          git push
