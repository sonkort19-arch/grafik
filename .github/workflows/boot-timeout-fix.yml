name: Boot timeout fix

on:
  push:
    branches:
      - fix-boot-timeout-2026-09-07

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/fix_boot_timeout.py
      - name: Syntax check
        run: node --check app.js
      - name: Regression tests
        run: node tests/run-tests.js
      - name: Verify patch
        run: |
          grep -q 'setTimeout(resolve,3500)' app.js
          grep -q 'initialDeviceResolved' app.js
          git diff --check
      - name: Commit tested app fix
        run: |
          git config user.name "MA Boot Fix"
          git config user.email "actions@users.noreply.github.com"
          git add app.js
          git diff --cached --check
          git commit -m "Prevent startup device check from hanging"
          git push
