name: Step 8 baseline browser check
on:
  push:
    paths:
      - '.github/workflows/step8-baseline-browser.yml'
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test current working app before extraction
        run: |
          python3 -m http.server 8765 >/tmp/ma-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome unavailable'
            exit 0
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=5000 --dump-dom http://127.0.0.1:8765/ >/tmp/rendered.html 2>/tmp/chrome.log || true
          echo 'BODY TAG:'
          grep -o '<body[^>]*>' /tmp/rendered.html | head -1 || true
          echo 'SAVE BADGE:'
          grep -o '<[^>]*id="saveBadge"[^>]*>[^<]*' /tmp/rendered.html | head -1 || true
          echo 'STARTUP ERROR MATCHES:'
          grep -o '>Ошибка запуска<' /tmp/rendered.html | head -1 || true
          echo 'BOOTING CLASS:'
          if grep -q 'class="[^"]*app-booting' /tmp/rendered.html; then echo YES; else echo NO; fi
