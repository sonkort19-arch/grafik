name: Step 8 finalize app
on:
  push:
    paths:
      - 'tools/refactor_step8_app.py'
      - '.github/workflows/step8-finalize-app.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract main app script
        run: python3 tools/refactor_step8_app.py

      - name: Syntax checks
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check app.js

      - name: Verify exact JavaScript preservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          old=subprocess.check_output(['git','show','HEAD:index.html']).decode('utf-8')
          anchor='<script>\n(function(){'
          start=old.rfind(anchor)
          if start<0: raise SystemExit('original inline app not found')
          content_start=start+len('<script>\n')
          end=old.find('</script>',content_start)
          if end<0: raise SystemExit('original inline app closing tag not found')
          original_js=old[content_start:end]
          app=Path('app.js').read_text(encoding='utf-8')
          if app != original_js:
              raise SystemExit('app.js differs from original inline JavaScript')
          expected=old[:start]+'<script src="app.js"></script>\n'+old[end+len('</script>'):]
          current=Path('index.html').read_text(encoding='utf-8')
          if current != expected:
              raise SystemExit('index.html changed beyond replacing inline app with app.js reference')
          print(f'Exact preservation OK: {len(app.encode("utf-8"))} bytes unchanged')
          PY

      - name: Verify HTML structure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          refs=['schedule.js','shifts.js','employees.js','supabase.js','wallets.js','admin.js','app.js']
          positions=[]
          for ref in refs:
              token=f'<script src="{ref}"></script>'
              pos=text.find(token)
              if pos<0: raise SystemExit(f'missing {ref}')
              positions.append(pos)
          if positions != sorted(positions): raise SystemExit('wrong script order')
          if '<script>\n(function(){' in text: raise SystemExit('inline main app remains')
          print('HTML/module structure OK')
          PY

      - name: Local asset smoke test
        run: |
          python3 -m http.server 8765 >/tmp/ma-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/ >/tmp/index-served.html
          curl -fsS http://127.0.0.1:8765/app.js >/tmp/app-served.js
          for file in schedule.js shifts.js employees.js supabase.js wallets.js admin.js; do
            curl -fsS "http://127.0.0.1:8765/$file" >/dev/null
          done
          test -s /tmp/index-served.html
          test -s /tmp/app-served.js
          grep -q '<script src="app.js"></script>' /tmp/index-served.html
          echo 'Local asset smoke test OK'

      - name: Publish final refactor
        run: |
          git config user.name "MA Modularization"
          git config user.email "actions@users.noreply.github.com"
          git add index.html app.js
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Step 8: move main application to app.js"
          git push
