name: Stage 3 error journal
on:
  push:
    paths:
      - 'tools/apply_stage3_errors.py'
      - '.github/workflows/stage3-errors.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply error journal patch
        run: python3 tools/apply_stage3_errors.py
      - name: Normalize whitespace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['app.js','index.html','styles.css','tests/run-tests.js','.github/workflows/ma-tests.yml']:
            p=Path(name)
            text=p.read_text(encoding='utf-8')
            text='\n'.join(line.rstrip() for line in text.splitlines()).rstrip()+"\n"
            p.write_text(text,encoding='utf-8')
          PY
      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check errors.js
          node --check app.js
          node --check tests/run-tests.js
      - name: Run regression suite
        run: node tests/run-tests.js
      - name: Verify stage 3 markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          html=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ('app logger','function logAppError(scope,error,meta={})',app),
            ('window error','window.addEventListener("error"',app),
            ('promise error','window.addEventListener("unhandledrejection"',app),
            ('settings render','renderErrorLog();',app),
            ('health row','id="systemErrorsText"',html),
            ('journal ui','id="errorLogList"',html),
            ('module','<script src="errors.js"></script>',html)
          ]
          for name,needle,text in checks:
            if needle not in text: raise SystemExit('missing '+name)
          print('Stage 3 markers OK')
          PY
      - name: Publish stage 3
        run: |
          git config user.name "MA Stability"
          git config user.email "actions@users.noreply.github.com"
          git add app.js index.html styles.css tests/run-tests.js .github/workflows/ma-tests.yml
          git diff --cached --check
          git commit -m "Add persistent error journal and global error handling"
          git push
