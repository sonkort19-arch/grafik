name: Patch Nova hours

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-nova-hours.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Nova hours
        run: python3 tools/patch_nova_hours_2026_09_07.py
      - name: Validate and publish
        run: |
          rm -f .github/workflows/patch-nova-hours.yml
          rm -f tools/patch_nova_hours_2026_09_07.py
          git config user.name "MA Schedule Updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/patch-nova-hours.yml tools/patch_nova_hours_2026_09_07.py
          git diff --cached --check
          git commit -m "Set Nova master shift to 09-19"
          git push origin HEAD:main
# retry 2
