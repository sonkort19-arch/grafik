name: MA Grafik tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ma-grafik-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Reject whitespace and merge-marker damage
        run: git diff --check HEAD^ HEAD || git diff --check

      - name: Run structural stability gates
        run: node tests/stability-gates.js

      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check errors.js
          node --check settings.js
          node --check devices.js
          node --check history.js
          node --check kpi.js
          node --check safety.js
          node --check assistant-core.js
          node --check assistant.js
          node --check assistant-attendance.js
          node --check assistant-owner.js
          node --check app.js
          node --check crm-phase1.js
          node --check crm-inventory.js
          node --check crm-finance.js
          node --check crm-final.js
          node --check crm.js
          node --check crm-location.js
          node --check tests/run-tests.js
          node --check tests/assistant-tests.js
          node --check tests/assistant-robustness-tests.js
          node --check tests/assistant-date-regression-tests.js
          node --check tests/assistant-routing-tests.js
          node --check tests/assistant-launcher-tests.js
          node --check tests/assistant-launcher-viewport-tests.js
          node --check tests/crm-regression-tests.js
          node --check tests/stability-gates.js
          node --input-type=module --check < api/mcp.js
          node --input-type=module --check < api/oauth-protected-resource.js
          node --input-type=module --check < api/openai-apps-challenge.js

      - name: Validate plugin manifest
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('.codex-plugin/plugin.json','utf8')); console.log('plugin.json OK')"

      - name: Run MA Grafik regression suite
        run: node tests/run-tests.js

      - name: Run free assistant parser tests
        run: node tests/assistant-tests.js

      - name: Run free assistant robustness tests
        run: node tests/assistant-robustness-tests.js

      - name: Run assistant date regression tests
        run: node tests/assistant-date-regression-tests.js

      - name: Run assistant routing regression tests
        run: node tests/assistant-routing-tests.js

      - name: Run assistant launcher regression tests
        run: node tests/assistant-launcher-tests.js

      - name: Run assistant mobile viewport tests
        run: node tests/assistant-launcher-viewport-tests.js

      - name: Run CRM audit regression checks
        run: node tests/crm-regression-tests.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check all Supabase functions
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name 'index.ts' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Supabase functions found"
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Deno check: $file"
            deno check "$file"
          done

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for production and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://grafik-umber.vercel.app"
          wait_for() { local url="$1"; local expected="$2"; for attempt in $(seq 1 24); do body="$(curl -fsS --max-time 10 "$url" 2>/dev/null || true)"; if [[ "$body" == *"$expected"* ]]; then echo "OK: $url"; return 0; fi; echo "Waiting for $url ($attempt/24)"; sleep 5; done; echo "FAILED: $url"; return 1; }
          wait_status() { local url="$1"; for attempt in $(seq 1 24); do if curl -fsS --max-time 10 "$url" >/dev/null 2>&1; then echo "OK: $url"; return 0; fi; echo "Waiting for $url ($attempt/24)"; sleep 5; done; echo "FAILED: $url"; return 1; }
          wait_for "$BASE/" "MA График"
          wait_for "$BASE/assistant-core.js" "MAAssistantCore"
          wait_for "$BASE/assistant.js" "Помощник МА График"
          wait_for "$BASE/assistant-attendance.js" "/assets/ma-assistant-icon.svg"
          wait_for "$BASE/assets/ma-assistant-icon.svg" "#a8ff00"
          wait_for "$BASE/assistant-owner.js" "MA Assistant owner"
          wait_for "$BASE/safety.js" "assistant-owner.js"
          wait_for "$BASE/mcp" '"service":"MA Grafik MCP"'
          wait_for "$BASE/.well-known/oauth-protected-resource" '"resource":"https://grafik-umber.vercel.app/mcp"'
          wait_for "$BASE/plugin/" "МА График для ChatGPT"
          wait_for "$BASE/oauth/consent.html" "Подключение ChatGPT"
          wait_for "$BASE/crm.html" "crm-final.js"
          wait_for "$BASE/crm-phase1.js" "ma-crm-phase1-api"
          wait_for "$BASE/crm-inventory.js" "ma-crm-inventory-api"
          wait_for "$BASE/crm-finance.js" "ma-crm-finance-api"
          wait_for "$BASE/crm-final.js" "create-repair-bundle"
          wait_status "$BASE/crm-location.js"
          headers="$(curl -sS -i --max-time 10 -X POST "$BASE/mcp" -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ma-grafik-smoke","version":"1.0"}}}')"
          [[ "$headers" =~ ^HTTP/[^[:space:]]+[[:space:]]401 ]]
          echo "OK: production smoke"
