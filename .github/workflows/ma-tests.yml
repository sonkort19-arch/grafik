name: MA Grafik tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check errors.js
          node --check settings.js
          node --check devices.js
          node --check history.js
          node --check kpi.js
          node --check safety.js
          node --check app.js
          node --check tests/run-tests.js
          node --input-type=module --check < api/mcp.js
          node --input-type=module --check < api/oauth-protected-resource.js
          node --input-type=module --check < api/openai-apps-challenge.js

      - name: Validate plugin manifest
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('.codex-plugin/plugin.json','utf8')); console.log('plugin.json OK')"

      - name: Run MA Grafik regression suite
        run: node tests/run-tests.js

      - name: Check read API syntax
        run: node --input-type=module --check < supabase/functions/ma-grafik-api/index.ts

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check new protected integration functions
        run: |
          deno check supabase/functions/ma-grafik-write-api/index.ts
          deno check supabase/functions/ma-grafik-mcp/index.ts

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for production and verify plugin endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://grafik-umber.vercel.app"

          wait_for() {
            local url="$1"
            local expected="$2"
            for attempt in $(seq 1 24); do
              body="$(curl -fsS --max-time 10 "$url" 2>/dev/null || true)"
              if printf '%s' "$body" | grep -Fq "$expected"; then
                echo "OK: $url"
                return 0
              fi
              echo "Waiting for $url ($attempt/24)"
              sleep 5
            done
            echo "FAILED: $url"
            return 1
          }

          wait_for "$BASE/" "MA График"
          wait_for "$BASE/mcp" '"service":"MA Grafik MCP"'
          wait_for "$BASE/.well-known/oauth-protected-resource" '"resource":"https://grafik-umber.vercel.app/mcp"'
          wait_for "$BASE/plugin/" "МА График для ChatGPT"
          wait_for "$BASE/oauth/consent.html" "Подключение ChatGPT"

          headers="$(curl -sS -i --max-time 10 -X POST "$BASE/mcp" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ma-grafik-smoke","version":"1.0"}}}')"

          printf '%s' "$headers" | grep -Eq '^HTTP/[^ ]+ 401'
          printf '%s' "$headers" | grep -Fq 'resource_metadata="https://grafik-umber.vercel.app/.well-known/oauth-protected-resource"'
          echo "OK: unauthorized MCP challenge points to public OAuth metadata"
