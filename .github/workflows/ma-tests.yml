name: MA Grafik tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check schedule.js
          node --check shifts.js
          node --check employees.js
          node --check supabase.js
          node --check wallets.js
          node --check admin.js
          node --check errors.js
          node --check settings.js
          node --check devices.js
          node --check history.js
          node --check kpi.js
          node --check safety.js
          node --check app.js
          node --check tests/run-tests.js
          node --input-type=module --check < api/mcp.js
          node --input-type=module --check < api/oauth-protected-resource.js
          node --input-type=module --check < api/openai-apps-challenge.js

      - name: Validate plugin manifest
        run: node -e "const fs=require('fs'); JSON.parse(fs.readFileSync('.codex-plugin/plugin.json','utf8')); console.log('plugin.json OK')"

      - name: Run MA Grafik regression suite
        run: node tests/run-tests.js

      - name: Check read API syntax
        run: node --input-type=module --check < supabase/functions/ma-grafik-api/index.ts

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check new protected integration functions
        run: |
          deno check supabase/functions/ma-grafik-write-api/index.ts
          deno check supabase/functions/ma-grafik-mcp/index.ts
