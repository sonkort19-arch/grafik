<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#246BFD">
<title>Установить MA Смена</title>
<link rel="manifest" href="./smena.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--bg:#F6F7F9;--surface:#FFFFFF;--surface-soft:#F8FAFC;--text:#18202B;--muted:#667085;--blue:#246BFD;--blue-hover:#1D5DEB;--line:#E3E7ED;--success:#21A66B}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text)}
body{padding:24px;min-height:100dvh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:520px;margin:auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.icon{width:54px;height:54px;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;letter-spacing:-.03em}
h1{margin:0;font-size:24px;line-height:1.15;color:var(--text);letter-spacing:-.03em}
.sub{margin:5px 0 0;color:var(--muted);font-size:13px}
.info{background:var(--surface-soft);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:13px;line-height:1.55;margin-bottom:16px;color:#475467}
button{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--line);font-size:16px;font-weight:800;cursor:pointer;font-family:inherit}
button:focus-visible{outline:3px solid rgba(36,107,253,.22);outline-offset:2px}
.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.primary:hover{background:var(--blue-hover);border-color:var(--blue-hover)}
.secondary{margin-top:8px;background:#fff;color:var(--text)}
.state{font-size:12px;line-height:1.45;color:var(--muted);margin-top:14px;text-align:center}
.state.ok{color:#176C48}
@media(max-width:560px){body{padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}.card{padding:18px;border-radius:16px}.icon{width:50px;height:50px}h1{font-size:22px}button{min-height:48px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <div class="icon">MA</div>
      <div>
        <h1>MA Смена</h1>
        <div class="sub">Приложение для рабочего компьютера</div>
      </div>
    </div>

    <div class="info">
      После установки MA Смена будет открываться отдельным окном без вкладок браузера.
      Она использует тот же сайт и ту же регистрацию рабочего компьютера.
    </div>

    <button class="primary" id="installBtn">Установить MA Смена</button>
    <button class="secondary" id="testBtn">Открыть MA Смена без установки</button>
    <div class="state" id="state">Подготавливаем установку…</div>
  </div>
</div>

<script>
let deferredPrompt=null;
const installBtn=document.getElementById("installBtn");
const state=document.getElementById("state");

function standalone(){
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true;
}

function render(){
  if(standalone()){
    installBtn.disabled=true;
    installBtn.textContent="MA Смена уже установлена";
    state.textContent="Приложение уже запущено в отдельном режиме.";
    state.className="state ok";
    return;
  }
  if(deferredPrompt){
    installBtn.disabled=false;
    installBtn.textContent="Установить MA Смена";
    state.textContent="Chrome готов установить приложение.";
    state.className="state ok";
  }else{
    installBtn.disabled=false;
    state.textContent="Если кнопка не вызовет окно установки: Chrome ⋮ → «Установить приложение».";
    state.className="state";
  }
}

window.addEventListener("beforeinstallprompt",(event)=>{
  event.preventDefault();
  deferredPrompt=event;
  render();
});

window.addEventListener("appinstalled",()=>{
  deferredPrompt=null;
  installBtn.disabled=true;
  installBtn.textContent="MA Смена установлена";
  state.textContent="Готово. Приложение появится в меню Пуск и среди приложений Chrome.";
  state.className="state ok";
});

installBtn.addEventListener("click",async()=>{
  if(standalone()) return;
  if(deferredPrompt){
    const p=deferredPrompt;
    deferredPrompt=null;
    p.prompt();
    const result=await p.userChoice;
    if(result.outcome==="accepted"){
      state.textContent="Установка выполнена.";
      state.className="state ok";
    }
    render();
    return;
  }
  alert("Если системное окно не появилось:\n\nОткрой меню Chrome ⋮ → «Установить приложение».");
});

document.getElementById("testBtn").addEventListener("click",()=>{
  location.href="./?startup=1";
});

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
render();
</script>
</body>
</html>
